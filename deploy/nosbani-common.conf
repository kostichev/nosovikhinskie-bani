# Общие правила сайта Носовихинских бань (подключается из nginx.conf)
index index.html;
charset utf-8;
server_tokens off;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

error_page 404 /404.html;

# www → без www (один адрес для поисковиков)
if ($host ~* ^www\.(.+)$) { return 301 $scheme://$1$request_uri; }

# предпросмотр по IP не индексируется: отдельный robots.txt
location = /robots.txt {
    default_type text/plain;
    if ($host !~* "xn--") { return 200 "User-agent: *\nDisallow: /\n"; }
    try_files $uri =404;
    expires 1d;
}

# Старые адреса сайта на Тильде → новые страницы (чтобы не терять поиск и закладки)
rewrite ^/(price|prices|tseny|ceny-i-uslugi|uslugi|services)/?$ /ceny/ permanent;
rewrite ^/(banya|sauna|saunas|rooms|nomera)/?$ /bani/ permanent;
rewrite ^/(rules|pravila-poseshcheniya|oferta|offer)/?$ /pravila/ permanent;
rewrite ^/(policy|privacy-policy|politika|politika-konfidencialnosti)/?$ /privacy/ permanent;
rewrite ^/(contacts|kontakty|contact)/?$ /#contacts permanent;
rewrite ^/(index\.php|main|home)/?$ / permanent;

# админка сайта
location ^~ /admin/ {
    client_max_body_size 3m;
    proxy_pass http://127.0.0.1:8096;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 200s;
}
location = /admin { return 301 /admin/; }

# заявки с сайта → сервис nosbani-lead (почта + MAX)
location = /api/lead {
    limit_except POST { deny all; }
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8095;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;
}

location / {
    try_files $uri $uri/ $uri.html =404;
    expires -1;
}

# картинки, иконки, шрифты — кэш на месяц
location ~* \.(webp|avif|jpe?g|png|gif|svg|ico|woff2?|js|css)$ {
    try_files $uri =404;
    expires 30d;
    access_log off;
}

location ~* \.(webmanifest|xml|txt)$ {
    try_files $uri =404;
    expires 1d;
}

# служебное не отдаём
location ~ /\. { deny all; }
